# 二维水动力模型 V1.0 标准用户配置模板。
# 当前阶段：load_config 仅加载并校验配置，不启动 Solver，也不读取栅格/CSV；映射需由调用方显式执行。
model:
  name: "case_001"                 # 必填；本次模拟案例名称，非空字符串。
  description: "2023东淀启用后288小时小时步长回放；文安洼未启用" # 可选；案例说明，非空字符串。
  gravity: 9.81                     # 可选；重力加速度，单位 m/s^2，必须大于 0。
  start_time: 0.0                   # 可选；模拟开始时间，单位 s，必须 >= 0。对应 2023-08-01T02:00:00+08:00。
  end_time: 1036800.0               # 必填；模拟结束时间，单位 s，必须大于 start_time。288 h = 1036800 s。
  output_interval: 3600.0           # 可选/兼容字段；单位 s；若填写必须与 output.interval 相同。
  coordinate_system: "EPSG:4548"   # 必填；水平 CRS 标识；DEM 映射要求与 DEM 相同且为平面/投影坐标；重投影暂未实现。
  units: "SI"                      # 可选；单位体系，目前唯一支持值为 SI。
  vertical_datum_required: true       # 可选；运行前要求确认 DEM/水位共同垂直基准，默认 true；具体基准暂未确定，当前仅作前置标志。
  target_vertical_datum: "1985国家高程基准" # 目标垂直基准；不会覆盖或猜测 DEM source vertical_datum。

domain:
  type: "structured"                # 可选；网格类型，目前仅支持 structured。
  xmin: 474150                         # 必填；计算区域 x 最小坐标，单位 m。
  xmax: 499500                      # 必填；计算区域 x 最大坐标，单位 m，必须大于 xmin。
  ymin: 4299600                         # 必填；计算区域 y 最小坐标，单位 m。
  ymax: 4335550                      # 必填；计算区域 y 最大坐标，单位 m，必须大于 ymin。
  dx: 50.0                          # 必填；x 方向网格尺寸，单位 m，V1.0 必须在 30～100（含）范围内。
  dy: 50.0                          # 必填；y 方向网格尺寸，单位 m，V1.0 必须在 30～100（含）范围内；可与 dx 不同。
  # nx、ny 不在用户配置中；程序根据 (xmax-xmin)/dx、(ymax-ymin)/dy 自动计算内部网格数量。

terrain:
  type: "raster"                    # 必填；地形输入方式：raster 或 constant。
  file: "../../data/dem/DEMn_1m.tif"              # raster 时必填；相对 case 目录的 DEM 路径；本仓库根目录样本仅作本地输入，不随代码提交。
  nodata: -32767                    # 可选；源栅格 NoData sentinel，必须是有限数值；不得将 NoData 当作 0。
  nodata_strategy: "error"          # 可选；默认 error；映射调用无法取得可靠高程时失败；nearest/interpolate 仅预留，调用时暂未实现。
  min_valid_coverage: null           # 可选；单元有效 DEM 面积比例阈值，范围 0～1；null 表示阈值尚未冻结且当前不判定。
  resampling:                       # 可选；DEM 到计算网格的映射策略；load_config 只保存，不自动读取或执行。
    strategy: "auto"              # 可选；默认 auto。已读 DEMDataset 的内存映射：更细→area_weighted_mean，同分辨率且完全对齐→direct，更粗→bilinear；条件不满足时报错。
  # elevation: 100.0                # constant 时使用，单位 m；本 raster 示例中不可填写。

initial_condition:
  type: "constant_depth"             # 必填；constant_depth、constant_level 或 raster。
  depth: 0.0                         # constant_depth 时必填；初始水深，单位 m，必须 >= 0。
  # vertical_datum: "confirmed-datum" # level/level_file 时在字段构造阶段必填；constant_depth 可省略。
  # level: 100.0                     # constant_level 时使用；初始水位，单位 m；本示例不可填写。
  # depth_file: "data/initial_depth.tif" # raster 时使用；初始水深栅格路径，暂不读取。
  # level_file: "data/initial_level.tif" # raster 时使用；初始水位栅格路径，暂不读取。
  velocity: null                     # 可选/预留；二维初始速度场接口，当前不参与计算。

# Manning 粗糙率：无量纲 n，constant 必须填写正数 manning_n；raster 的 file 暂由调用方读取，当前不自动读取。
roughness:
  type: "constant"                  # 必填；糙率输入方式：constant 或 raster。
  manning_n: 0.035                   # constant 时必填；Manning 糙率系数，无量纲，必须 > 0。
  # file: "data/manning.tif"        # raster 时使用；Manning 栅格路径，当前仅校验字符串。

boundary:
  - id: "inflow"                    # 必填；边界唯一标识，列表内不可重复。
    location: "west"                # 必填；structured 网格边界位置：west/east/north/south。
    type: "discharge"               # 必填；discharge、water_level、wall 或 timeseries。
    timeseries:                      # discharge 的时间序列输入；CSV 默认列为 time,value。
      file: "data/inflow.csv"       # 新盖房分洪流量，单位 m3/s；当前由回放脚本读取。
      time_column: "time"           # 可选；时间列名，默认 time。
      value_column: "value"         # 可选；数值列名，默认 value。
      time_unit: "s"                # 可选；时间单位，目前仅支持秒 s。
  - id: "outflow"                   # 必填；边界唯一标识。
    location: "east"                # 必填；边界位置。
    type: "discharge"               # 独流减河/西河闸出流，单位 m3/s。
    timeseries:
      file: "data/outflow.csv"
      time_column: "time"
      value_column: "value"
      time_unit: "s"
  - id: "north_wall"                # 必填；边界唯一标识。
    location: "north"               # 必填；边界位置。
    type: "wall"                    # wall 当前仅表示接口类型，具体物理实现暂未开始。
  - id: "south_wall"                # 必填；边界唯一标识。
    location: "south"               # 必填；边界位置。
    type: "wall"                    # wall 当前仅表示接口类型，具体物理实现暂未开始。

source:
  rainfall:
    enabled: true                    # 大清河系 23·7 过程雨量 273 mm，按 288 h 均匀分配。
    type: "timeseries"
    file: "data/rainfall.csv"
    time_unit: "s"
    intensity_unit: "mm/h"

numerics:
  scheme: null                       # 预留；空间离散方案，暂未冻结且暂未实现。
  flux: null                         # 预留；数值通量方案，暂未冻结且暂未实现。
  time_integrator: null              # 预留；时间积分方案，暂未冻结且暂未实现。
  cfl: 0.5                           # 配置层参数；无量纲，范围 0 < cfl <= 1，不代表具体算法。
  min_depth: 0.001                  # 配置层阈值，单位 m，必须 >= 0 且不小于 dry_depth。
  dry_depth: 0.0001                 # 配置层阈值，单位 m，必须 >= 0；干湿判定算法暂未实现。

output:
  directory: "results"              # 可选；结果目录路径，默认 results；输出器暂未实现。
  interval: 3600.0                   # 可选；输出时间间隔，单位 s，必须 > 0。小时步长输出。
  variables:
    - "water_depth"
    - "water_level"
    - "velocity_x"
    - "velocity_y"
    - "velocity_magnitude"
    - "discharge"
    - "maximum_depth"
    - "maximum_velocity"
    - "arrival_time"
  format: "netcdf"                  # 可选；netcdf/geotiff/csv；格式枚举仅作接口预留。

validation:
  enabled: true                      # 可选；是否启用未来运行校验，默认 false；算法暂未实现。
  mass_balance_check: true           # 可选；质量守恒校验开关，需 enabled=true；暂未实现。
  report: true                       # 可选；是否生成未来校验报告，默认 true；报告器暂未实现。
