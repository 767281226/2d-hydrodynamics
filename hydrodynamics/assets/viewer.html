<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Native Triangle Result Viewer</title>
<style>

</head>
<body>

<aside id="side">
  <div><h1 id="title">Native Triangle Result Viewer</h1><div class="sub" id="description">Loading validated output profiles…</div></div>
  <div id="forcing" role="note"></div><div class="sub" id="extent"></div>
  <label class="field">显示数据
    <select id="profile"><option value="native_web">Native 三角网格</option><option value="compatibility_grid">Derived 兼容网格</option></select>
  </label>
  <label class="field">图层
    <select id="layer"></select>
  </label>
  <div class="kpi">
    <div><div class="value" id="kTime">--</div><div class="label">时间</div></div>
    <div><div class="value" id="kMax">--</div><div class="label" id="maxLabel">本帧最大水深</div></div>
    <div><div class="value" id="kWet">--</div><div class="label" id="wetLabel">湿面 / 面积</div></div>
    <div><div class="value" id="kFrame">--</div><div class="label">帧</div></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center"><button id="play" type="button">播放</button><span class="sub" id="timeLabel"></span></div>
  <input type="range" id="seek" min="0" max="0" value="0" aria-label="选择时间帧">
  <div id="legend"></div><div class="sub" id="legendText">图例</div>
  <div class="sub" id="status">加载中…</div>
</aside>
