[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-d-hydrodynamics"
version = "0.1.0"
description = "Typed input and configuration interface for a future 2-D hydrodynamics engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pyshp>=2.3,<3.0"]
raster = ["rasterio>=1.3,<2.0"]
netcdf = ["netCDF4>=1.6,<2.0"]
workflow = ["netCDF4>=1.6,<2.0", "pyproj>=3.6,<4.0"]

[project.scripts]
hydrodynamics-run = "hydrodynamics.workflow:main"

[tool.setuptools.packages.find]
include = ["hydrodynamics*"]

[tool.setuptools.package-data]
hydrodynamics = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
