[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-d-hydrodynamics"
version = "0.1.0"
description = "Typed input and configuration interface for a future 2-D hydrodynamics engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.24,<3.0",
    "tzdata>=2024.1,<2027.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pyshp>=2.3,<3.0"]
raster = ["rasterio>=1.3,<2.0"]
netcdf = ["netCDF4>=1.6,<2.0"]
workflow = ["netCDF4>=1.6,<2.0", "pyproj>=3.6,<4.0"]
triangular = ["netCDF4>=1.6,<2.0", "pyproj>=3.6,<4.0", "shapely>=2.0,<3.0"]
shp = ["pyshp>=2.3,<3.0", "pyproj>=3.6,<4.0", "netCDF4>=1.6,<2.0"]
gmsh = ["gmsh>=4.11,<5.0"]

[project.scripts]
hydrodynamics-native-batch = "hydrodynamics.native_batch_launcher:main"
hydrodynamics-triangular-run = "hydrodynamics.triangular_solver:main"
hydrodynamics-rehearsal-package = "hydrodynamics.rehearsal_package:main"
hydrodynamics-run = "hydrodynamics.workflow:main"
hydrodynamics-mesh-prepare = "hydrodynamics.mesh_preparation:main"
hydrodynamics-business-prepare = "hydrodynamics.triangular_business:main"
hydrodynamics-rehearsal = "hydrodynamics.rehearsal_contract:main"

hydrodynamics-triangle-shp = "hydrodynamics.triangular_shp_export:main"

hydrodynamics-triangular-source-prepare = "hydrodynamics.triangular_sources:main"
hydrodynamics-triangular-manning-run = "hydrodynamics.triangular_manning:main"
hydrodynamics-triangular-source-run = "hydrodynamics.triangular_source:main"

[tool.setuptools.packages.find]
include = ["hydrodynamics*"]

[tool.setuptools.package-data]
hydrodynamics = ["assets/*.html", "rehearsal_data/*.json", "shapefile_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
